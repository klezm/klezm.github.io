name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          CHECK_LINKS: 'true'
